version: "3.9"

services:

  # -----------------------------------
  # Consul Cluster (3 servers for HA)
  # -----------------------------------
  consul-1:
    image: docker.io/hashicorp/consul:1.16
    command: agent -server -bootstrap-expect=3 -ui -client=0.0.0.0 -retry-join=consul-2 -retry-join=consul-3
    ports:
      - "8500:8500"
      - "8600:8600/udp"

  consul-2:
    image: docker.io/hashicorp/consul:1.16
    command: agent -server -bootstrap-expect=3 -retry-join=consul-1 -retry-join=consul-3

  consul-3:
    image: docker.io/hashicorp/consul:1.16
    command: agent -server -bootstrap-expect=3 -retry-join=consul-1 -retry-join=consul-2

  # -----------------------------------
  # Redis Cluster (6 nodes: 3 masters + 3 replicas)
  # -----------------------------------
  redis-1:
    image: docker.io/redis:7
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6379
    ports:
      - "6379:6379"
    volumes:
      - redis-1-data:/data

  redis-2:
    image: docker.io/redis:7
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6380
    ports:
      - "6380:6380"
    volumes:
      - redis-2-data:/data

  redis-3:
    image: docker.io/redis:7
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6381
    ports:
      - "6381:6381"
    volumes:
      - redis-3-data:/data

  redis-4:
    image: docker.io/redis:7
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6382
    ports:
      - "6382:6382"
    volumes:
      - redis-4-data:/data

  redis-5:
    image: docker.io/redis:7
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6383
    ports:
      - "6383:6383"
    volumes:
      - redis-5-data:/data

  redis-6:
    image: docker.io/redis:7
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6384
    ports:
      - "6384:6384"
    volumes:
      - redis-6-data:/data

  # Redis Cluster initialization
  redis-cluster-init:
    image: docker.io/redis:7
    command: >
      bash -c "sleep 10 && 
      redis-cli --cluster create 
      redis-1:6379 redis-2:6380 redis-3:6381 
      redis-4:6382 redis-5:6383 redis-6:6384 
      --cluster-replicas 1 --cluster-yes"
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6

  # -----------------------------------
  # NATS Cluster (3 nodes for HA)
  # -----------------------------------
  nats-1:
    image: docker.io/nats:latest
    command: 
      - "-cluster"
      - "nats://0.0.0.0:6222"
      - "-routes"
      - "nats://nats-2:6222,nats://nats-3:6222"
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"

  nats-2:
    image: docker.io/nats:latest
    command:
      - "-cluster"
      - "nats://0.0.0.0:6222"
      - "-routes"
      - "nats://nats-1:6222,nats://nats-3:6222"
    ports:
      - "4223:4222"

  nats-3:
    image: docker.io/nats:latest
    command:
      - "-cluster"
      - "nats://0.0.0.0:6222"
      - "-routes"
      - "nats://nats-1:6222,nats://nats-2:6222"
    ports:
      - "4224:4222"

  # -----------------------------------
  # SeaweedFS (storage subsystem)
  # -----------------------------------
  seaweed-master:
    image: docker.io/chrislusf/seaweedfs
    command: "master -ip=seaweed-master"
    ports:
      - "9333:9333"

  seaweed-volume:
    image: docker.io/chrislusf/seaweedfs
    command: "volume -mserver=seaweed-master:9333 -dir=/data"
    ports:
      - "8080:8080"

  seaweed-filer:
    image: docker.io/chrislusf/seaweedfs
    command: "filer -master=seaweed-master:9333"
    ports:
      - "8888:8888"

  # -----------------------------------
  # Chat Nodes (3 replicas, can scale horizontally)
  # -----------------------------------
  chat-node-1:
    build: ./chat-node
    environment:
      - NODE_ID=1
      # Redis Cluster: connect to any node, client handles routing
      - REDIS_URL=redis://redis-1:6379,redis-2:6380,redis-3:6381
      # NATS Cluster: connect to multiple servers for failover
      - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - CONSUL_URL=http://consul-1:8500
      - FILESTORE_URL=http://seaweed-filer:8888
    ports:
      - "3001:3001"
    depends_on:
      - consul-1
      - redis-1
      - nats-1

  chat-node-2:
    build: ./chat-node
    environment:
      - NODE_ID=2
      - REDIS_URL=redis://redis-1:6379,redis-2:6380,redis-3:6381
      - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - CONSUL_URL=http://consul-1:8500
      - FILESTORE_URL=http://seaweed-filer:8888
    ports:
      - "3002:3002"
    depends_on:
      - consul-1
      - redis-1
      - nats-1

  chat-node-3:
    build: ./chat-node
    environment:
      - NODE_ID=3
      - REDIS_URL=redis://redis-1:6379,redis-2:6380,redis-3:6381
      - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - CONSUL_URL=http://consul-1:8500
      - FILESTORE_URL=http://seaweed-filer:8888
    ports:
      - "3003:3003"
    depends_on:
      - consul-1
      - redis-1
      - nats-1

volumes:
  redis-1-data:
  redis-2-data:
  redis-3-data:
  redis-4-data:
  redis-5-data:
  redis-6-data:
  seaweed-data: