version: '3.8'

services:
  # 1. Prometheus (Coleta de Métricas)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/nodes.yaml:/etc/prometheus/nodes.yaml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9091:9090"
    networks:
      - chaos-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 2. Grafana (Visualização)
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    networks:
      - chaos-net
    depends_on:
      - prometheus

  # 3. Loki (Logs)
  loki:
    image: grafana/loki:2.8.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - chaos-net

  # 4. Chaos UI (Interface de Controle)
  chaos-ui:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: chaos-ui
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/.ssh:/root/.ssh:ro
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - chaos-net
    depends_on:
      - prometheus

  # 5. Blackbox Exporter (Latência/Ping)
  blackbox_exporter:
    image: prom/blackbox-exporter:master
    container_name: blackbox_exporter
    ports:
      - "9115:9115"
    volumes:
      - ./config/blackbox.yml:/config/blackbox.yml
    command: --config.file=/config/blackbox.yml
    networks:
      - chaos-net

networks:
  chaos-net:
    driver: bridge
