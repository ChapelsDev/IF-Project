version: '3.8'

services:
  # 1. Prometheus (Coleta de Métricas)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9091:9090"
    networks:
      - chaos-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 2. Grafana (Visualização)
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - chaos-net
    depends_on:
      - prometheus

  # 3. Node Exporter (Métricas da Máquina Local)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    # Importante: network_mode host para pegar métricas reais da máquina host
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'

  # 4. Chaos API (Sua aplicação Python)
  chaos-api:
    build: .
    container_name: chaos-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Montar chaves SSH para permitir acesso aos nós (ajuste o caminho se necessário)
      - ~/.ssh:/root/.ssh:ro
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chaos-net
    depends_on:
      - prometheus
      - loki
      - jaeger

  # 5. Loki (Logs)
  loki:
    image: grafana/loki:2.8.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - chaos-net

  # 6. Jaeger (Traces)
  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686" # UI
      - "14268:14268"
      - "14250:14250"
    networks:
      - chaos-net

  # 7. OpenTelemetry Collector (Opcional, mas recomendado para centralizar)
  otel-collector:
    image: otel/opentelemetry-collector:0.81.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - chaos-net
    depends_on:
      - jaeger

networks:
  chaos-net:
    driver: bridge
