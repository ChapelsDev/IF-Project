---
- name: "Consul | Registo SeaweedFS (Versão Hardened & Defensiva)"
  hosts: cluster
  become: true
  gather_facts: yes

  vars:
    # 1️⃣ CONFIGURAÇÃO E ENDEREÇAMENTO
    consul_http: "http://127.0.0.1:8500"
    host_ip: "{{ ansible_host }}"

    # 2️⃣ FONTE ÚNICA DE VERDADE: Extração por IP (.51-.53)
    master_ips: "{{ groups['cluster'] | map('extract', hostvars, 'ansible_host') | select('match', '.*\\.(51|52|53)$') | list }}"

    is_master: "{{ host_ip in master_ips }}"
    is_volume: true

  pre_tasks:
    - name: "Guardrail | Validar subnet esperada do cluster"
      assert:
        that:
          - host_ip is match('^192\\.168\\.100\\.')
        fail_msg: "SEGURANÇA: O host {{ host_ip }} está fora da subnet 192.168.100.x autorizada."

    - name: "Guardrail | Verificar saúde do Consul local"
      uri:
        url: "{{ consul_http }}/v1/status/leader"
        return_content: yes
      register: consul_status
      failed_when: consul_status.status != 200 or consul_status.content == '""'

    - name: "Guardrail | Validar quórum de Masters no inventário"
      assert:
        that:
          - master_ips | length == 3
        fail_msg: "TOPOLOGIA: Foram detectados {{ master_ips | length }} masters. Esperados exatamente 3 (.51, .52, .53)."

  tasks:
    ####################################################################
    # 3. LIMPEZA PREEMPTIVA (IDEMPOTÊNCIA)
    ####################################################################
    - name: "Consul | Remover registos antigos para evitar drift"
      uri:
        url: "{{ consul_http }}/v1/agent/service/deregister/{{ item }}"
        method: PUT
        status_code: [200, 404]
      loop:
        - "seaweed-master-{{ inventory_hostname }}"
        - "seaweed-filer-{{ inventory_hostname }}"
        - "seaweed-volume-{{ inventory_hostname }}"
      changed_when: false

    ####################################################################
    # 4. REGISTO DE SERVIÇOS (MASTER, FILER, VOLUME)
    ####################################################################
    - name: "Consul | Registar Seaweed Master"
      when: is_master
      uri:
        url: "{{ consul_http }}/v1/agent/service/register"
        method: PUT
        body_format: json
        body:
          ID: "seaweed-master-{{ inventory_hostname }}"
          Name: "seaweed-master"
          Address: "{{ host_ip }}"
          Port: 9333
          Tags: ["seaweed", "master", "raft"]
          Check:
            HTTP: "http://{{ host_ip }}:9333/cluster/status"
            Interval: "10s"
            Timeout: "2s"
            DeregisterCriticalServiceAfter: "1m"
      changed_when: false

    - name: "Consul | Registar Seaweed Filer"
      when: is_master
      uri:
        url: "{{ consul_http }}/v1/agent/service/register"
        method: PUT
        body_format: json
        body:
          ID: "seaweed-filer-{{ inventory_hostname }}"
          Name: "seaweed-filer"
          Address: "{{ host_ip }}"
          Port: 8888
          Tags: ["seaweed", "filer", "api"]
          Check:
            HTTP: "http://{{ host_ip }}:8888/"
            Interval: "10s"
            Timeout: "2s"
            DeregisterCriticalServiceAfter: "1m"
      changed_when: false

    - name: "Consul | Registar Seaweed Volume"
      uri:
        url: "{{ consul_http }}/v1/agent/service/register"
        method: PUT
        body_format: json
        body:
          ID: "seaweed-volume-{{ inventory_hostname }}"
          Name: "seaweed-volume"
          Address: "{{ host_ip }}"
          Port: 8080
          Tags: ["seaweed", "volume", "data-plane"]
          Check:
            HTTP: "http://{{ host_ip }}:8080/"
            Interval: "10s"
            Timeout: "2s"
            DeregisterCriticalServiceAfter: "1m"
      changed_when: false

  post_tasks:
    - name: "Audit | Estado do Nó"
      debug:
        msg: "Nó {{ host_ip }} validado na subnet e registado no Consul como {{ 'MASTER/FILER/VOLUME' if is_master else 'VOLUME ONLY' }}."
