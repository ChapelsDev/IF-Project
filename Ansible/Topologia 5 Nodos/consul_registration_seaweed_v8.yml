---
- name: "Consul | Registo SeaweedFS (SRE-grade, determinístico)"
  hosts: cluster
  become: true
  gather_facts: yes

  vars:
    consul_http: "http://127.0.0.1:8500"
    host_ip: "{{ ansible_host }}"

    # 1️⃣ FONTE ÚNICA DE VERDADE: Seleção por sufixo de IP (SRE-Grade)
    # Identifica .51, .52 e .53 como Masters, independentemente do nome do host
    master_ips: "{{ groups['cluster'] | map('extract', hostvars, 'ansible_host') | select('match', '.*\\.(51|52|53)$') | list }}"

    is_master: "{{ host_ip in master_ips }}"
    is_volume: true  # Todos os 5 nós no grupo cluster são volumes

  pre_tasks:
    - name: "Guardrail | Verificar se Consul Agent está saudável"
      uri:
        url: "{{ consul_http }}/v1/status/leader"
        return_content: yes
      register: consul_status
      failed_when: consul_status.status != 200 or consul_status.content == '""'

    - name: "Guardrail | Validar consistência da topologia"
      assert:
        that:
          - master_ips | length == 3
          - is_master | type_debug == 'bool'
        fail_msg: "ERRO: A detecção de Masters falhou ou não encontrou exatamente 3 nós."

  tasks:
    ####################################################################
    # 2. LIMPEZA DETERMINÍSTICA (IDEMPOTÊNCIA)
    ####################################################################
    - name: "Consul | Limpeza preemptiva de registos"
      uri:
        url: "{{ consul_http }}/v1/agent/service/deregister/{{ item }}"
        method: PUT
        status_code: [200, 404]
      loop:
        - "seaweed-master-{{ inventory_hostname }}"
        - "seaweed-filer-{{ inventory_hostname }}"
        - "seaweed-volume-{{ inventory_hostname }}"
      changed_when: false

    ####################################################################
    # 3. REGISTO DO PLANO DE CONTROLE (MASTER)
    ####################################################################
    - name: "Consul | Registar Seaweed Master"
      when: is_master
      uri:
        url: "{{ consul_http }}/v1/agent/service/register"
        method: PUT
        body_format: json
        body:
          ID: "seaweed-master-{{ inventory_hostname }}"
          Name: "seaweed-master"
          Address: "{{ host_ip }}"
          Port: 9333
          Tags: ["seaweed", "master", "raft", "control-plane"]
          Check:
            Name: "Seaweed Master Raft Check"
            HTTP: "http://{{ host_ip }}:9333/cluster/status"
            Interval: "10s"
            Timeout: "2s"
            DeregisterCriticalServiceAfter: "1m"
      changed_when: false

    ####################################################################
    # 4. REGISTO DO PLANO DE ACESSO (FILER)
    ####################################################################
    - name: "Consul | Registar Seaweed Filer"
      when: is_master
      uri:
        url: "{{ consul_http }}/v1/agent/service/register"
        method: PUT
        body_format: json
        body:
          ID: "seaweed-filer-{{ inventory_hostname }}"
          Name: "seaweed-filer"
          Address: "{{ host_ip }}"
          Port: 8888
          Tags: ["seaweed", "filer", "api"]
          Check:
            Name: "Seaweed Filer HTTP Check"
            HTTP: "http://{{ host_ip }}:8888/"
            Interval: "10s"
            Timeout: "2s"
            DeregisterCriticalServiceAfter: "1m"
      changed_when: false

    ####################################################################
    # 5. REGISTO DO PLANO DE DADOS (VOLUME)
    ####################################################################
    - name: "Consul | Registar Seaweed Volume"
      uri:
        url: "{{ consul_http }}/v1/agent/service/register"
        method: PUT
        body_format: json
        body:
          ID: "seaweed-volume-{{ inventory_hostname }}"
          Name: "seaweed-volume"
          Address: "{{ host_ip }}"
          Port: 8080
          Tags: ["seaweed", "volume", "data-plane"]
          Check:
            Name: "Seaweed Volume Storage Check"
            HTTP: "http://{{ host_ip }}:8080/"
            Interval: "10s"
            Timeout: "2s"
            DeregisterCriticalServiceAfter: "1m"
      changed_when: false

  post_tasks:
    - name: "Audit | Estado final da topologia no nó"
      debug:
        msg: >
          DEPLOY CONCLUÍDO: {{ inventory_hostname }} ({{ host_ip }}) 
          configurado como {{ 'MASTER+FILER+VOLUME' if is_master else 'VOLUME ONLY' }}.
