---
- name: "Deploy Completo SeaweedFS - Alta Disponibilidade e Resiliência"
  hosts: cluster
  become: true
  vars:
    # Definição dos Masters (Quórum de 3 nós para HA)
    master_nodes: "192.168.100.51:9333,192.168.100.52:9333,192.168.100.53:9333"
    # IP do líder principal para os serviços dependentes
    primary_master: "192.168.100.51"
    primary_filer: "192.168.100.51"

  tasks:
    ## 1. PREPARAÇÃO DO AMBIENTE
    - name: "Instalar dependências do sistema"
      apt:
        name: [fuse, jq, curl]
        state: present
        update_cache: yes

    - name: "Criar estrutura de diretórios de dados"
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /data/seaweedfs/master
        - /data/seaweedfs/volume
        - /data/seaweedfs/filer

    ## 2. CONFIGURAÇÃO DO MASTER (Apenas nós 51, 52 e 53)
    - name: "Configurar Serviço Master (HA Quorum)"
      when: inventory_hostname in ['node51', 'node52', 'node53']
      copy:
        dest: /etc/systemd/system/seaweed_master.service
        content: |
          [Unit]
          Description=SeaweedFS Master
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/weed master -ip={{ ansible_host }} -port=9333 -mdir=/data/seaweedfs/master -peers={% if inventory_hostname == 'node51' %}192.168.100.52:9333,192.168.100.53:9333{% elif inventory_hostname == 'node52' %}192.168.100.51:9333,192.168.100.53:9333{% elif inventory_hostname == 'node53' %}192.168.100.51:9333,192.168.100.52:9333{% endif %}
          
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    ## 3. CONFIGURAÇÃO DO VOLUME (Todos os nós: 51 a 57)
    - name: "Configurar Serviço Volume"
      copy:
        dest: /etc/systemd/system/seaweed_volume.service
        content: |
          [Unit]
          Description=SeaweedFS Volume
          After=network.target seaweed_master.service

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/weed volume -mserver={{ master_nodes }} -ip={{ ansible_host }} -port=8080 -dir=/data/seaweedfs/volume -max=20
          
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    ## 4. CONFIGURAÇÃO DO FILER (Nós 51, 52 e 53 para redundância de entrada)
    - name: "Configurar Serviço Filer"
      when: inventory_hostname in ['node51', 'node52', 'node53']
      copy:
        dest: /etc/systemd/system/seaweed_filer.service
        content: |
          [Unit]
          Description=SeaweedFS Filer
          After=network.target seaweed_master.service

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/weed filer -master={{ master_nodes }} -ip={{ ansible_host }} -port=8888
          
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    ## 5. CONFIGURAÇÃO DO MOUNT (Para acesso local em todos os nós)
    - name: "Configurar Serviço Mount"
      copy:
        dest: /etc/systemd/system/seaweed_mount.service
        content: |
          [Unit]
          Description=SeaweedFS Mount
          After=network.target seaweed_filer.service

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/weed mount -filer={{ primary_filer }}:8888 -dir=/mnt/seaweed -filer.path=/
          
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target

    ## 6. ORQUESTRAÇÃO DO ARRANQUE (Garantir ordem de dependência)
    - name: "Reload systemd e ativar serviços"
      systemd:
        daemon_reload: yes

    - name: "Iniciar Master Nodes"
      when: inventory_hostname in ['node51', 'node52', 'node53']
      systemd:
        name: seaweed_master
        state: restarted
        enabled: yes

    - name: "Pausa para eleição de Líder (Raft)"
      pause:
        seconds: 10

    - name: "Iniciar Volume Nodes"
      systemd:
        name: seaweed_volume
        state: restarted
        enabled: yes

    - name: "Iniciar Filers e Mounts"
      systemd:
        name: "{{ item }}"
        state: restarted
        enabled: yes
      loop:
        - seaweed_filer
        - seaweed_mount
      when: inventory_hostname in ['node51', 'node52', 'node53'] or (item == 'seaweed_mount')