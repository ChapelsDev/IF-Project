<div class="p-4 bg-gray-900/50 rounded border border-yellow-500/30 text-yellow-200">
    <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2 animate-pulse">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            <span class="font-bold">Ataque Iniciado!</span>
        </div>
        <button hx-post="/experiment/stop" 
                hx-vals='{"pids": "{{ pids }}"}' 
                hx-target="#execution-result"
                class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-1 px-3 rounded transition pointer-events-auto shadow-lg z-10">
            PARAR TODOS
        </button>
    </div>
    <p>O Chaos Toolkit está rodando em background (PIDs: {{ pids }}).</p>
    <p class="text-sm text-gray-400 mt-2">Verifique os logs do container ou o Grafana para ver o impacto.</p>
</div>
