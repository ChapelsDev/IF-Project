version: "3.7"

services:
  master:
    image: chrislusf/seaweedfs
    command: "master -port=9333 -ip=master -peers=none -defaultReplication=001"
    ports:
      - "9333:9333"
    networks:
      - weednet

  volume1:
    image: chrislusf/seaweedfs
    command: "volume -port=8080 -ip=volume1 -mserver=master:9333 -dir=/data"
    volumes:
      - vol1:/data
    ports:
      - "8080:8080"
    networks:
      - weednet

  volume2:
    image: chrislusf/seaweedfs
    command: "volume -port=8081 -ip=volume2 -mserver=master:9333 -dir=/data"
    volumes:
      - vol2:/data
    ports:
      - "8081:8081"
    networks:
      - weednet

  filer:
    image: chrislusf/seaweedfs
    command: "filer -master=master:9333 -ip=filer -port=8888"
    ports:
      - "8888:8888"
    volumes:
      - filerldb:/data
    networks:
      - weednet

volumes:
  vol1:
  vol2:
  filerldb:

networks:
  weednet:
