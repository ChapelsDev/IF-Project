global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Scrape node_exporter instances directly on the host,
  # where deploy_agents registered them on ports 9100/9101/9102
  - job_name: 'chaos_nodes'
    file_sd_configs:
      - files:
        - '/etc/prometheus/prometheus_targets.json'


  # OPTIONAL: if you also want to use Consul SD later, keep this,
  # but it isn't strictly needed if static targets work.
  - job_name: 'consul_services'
    consul_sd_configs:
      - server: 'http://192.168.1.196:8500'   # Consul on host
        services: []
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: job
      - source_labels: [job]
        regex: node-exporter
        target_label: job
        replacement: node

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']