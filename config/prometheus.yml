global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitoramento do Consul (Métricas dos Agentes)
  - job_name: 'consul_metrics'
    metrics_path: '/v1/agent/metrics'
    params:
      format: ['prometheus']
    static_configs:
      - targets: 
        - '192.168.1.72:8500' # PC Remoto
        - '192.168.1.68:8500' # Seu PC Local (Control Plane) 

  - job_name: 'seaweedfs'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.1.72:9324']
        labels:
          role: 'master'
      - targets: ['192.168.1.72:9325']
        labels:
          role: 'volume'
      - targets: ['192.168.1.72:9327']
        labels:
          role: 'filer'

  - job_name: 'node_exporter'
    static_configs:
      - targets: 
        - '192.168.1.72:9100'
        - '192.168.1.68:9100'

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
        - 192.168.1.72
        - 192.168.1.68
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
