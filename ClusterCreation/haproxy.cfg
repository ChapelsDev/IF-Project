global
        log /dev/log    local0
        log /dev/log    local1 notice
        chroot /var/lib/haproxy
        stats socket /run/haproxy/admin.sock mode 660 level admin
        stats timeout 30s
        user haproxy
        group haproxy
        daemon

        # Default SSL material locations
        ca-base /etc/ssl/certs
        crt-base /etc/ssl/private

        # See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.0.3&config=intermediate
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
        log     global
        mode    http
        option  httplog
        option  dontlognull
        timeout connect 5000
        timeout client  50000
        timeout server  50000
        errorfile 400 /etc/haproxy/errors/400.http
        errorfile 403 /etc/haproxy/errors/403.http
        errorfile 408 /etc/haproxy/errors/408.http
        errorfile 500 /etc/haproxy/errors/500.http
        errorfile 502 /etc/haproxy/errors/502.http
        errorfile 503 /etc/haproxy/errors/503.http
        errorfile 504 /etc/haproxy/errors/504.http
# -------------------------------------------------------------------
# Consul DNS resolver (service discovery)
# If Consul DNS is NOT local, replace 127.0.0.1 with a Consul node IP.
# -------------------------------------------------------------------
resolvers consul
        nameserver dns1 127.0.0.1:8600
        resolve_retries 3
        timeout resolve 1s
        timeout retry   1s
        hold valid      5s


# -------------------------------------------------------------------
# HAProxy stats page (HTTP)
# Access: http://<node-ip>:8404/stats
# -------------------------------------------------------------------
frontend stats
        bind 0.0.0.0:8404
        mode http
        stats enable
        stats uri /stats
        stats refresh 5s


# -------------------------------------------------------------------
# FILESYSTEM frontdoor (HTTP) -> Consul-discovered backends
# VIP: 192.168.1.201:9000
# Consul service name: filesystem
# Health endpoint: GET /health must return 200
# -------------------------------------------------------------------
frontend fs_front
        bind 0.0.0.0:9000
        mode http
        option httplog
        default_backend fs_back

backend fs_back
        mode http
        balance roundrobin

        option httpchk GET /health
        http-check expect status 200

        server-template fs 1-20 _filesystem._tcp.service.consul resolvers consul init-addr none check


# -------------------------------------------------------------------
# CHAT frontdoor (TCP) -> Consul-discovered backends
# VIP: 192.168.1.201:9100
# Consul service name: chat
# -------------------------------------------------------------------
frontend chat_front
        bind 0.0.0.0:9100
        mode tcp
        option tcplog
        default_backend chat_back

backend chat_back
        mode tcp
        balance roundrobin

        server-template chat 1-20 _chat._tcp.service.consul resolvers consul init-addr none check