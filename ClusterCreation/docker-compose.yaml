services:
  consul-server1:
    build: .
    container_name: consul-server1
    cap_add:
      - NET_ADMIN
    command: [
      "agent",
      "-server",
      "-bootstrap-expect=3",
      "-node=server1",
      "-datacenter=dc1",
      "-bind=0.0.0.0",
      "-client=0.0.0.0",
      "-ui",
      "-data-dir=/consul/data"
    ]
    ports:
      - "8500:8500"       # HTTP / UI
      - "8600:8600/udp"   # DNS
      - "2021:22"
      - "9100:9100"   # Node Exporter
    networks:
      - consul-net
    #restart: unless-stopped
    volumes:
      - consul-server1-data:/consul/data
 
  consul-server2:
    build: .
    container_name: consul-server2
    cap_add:
      - NET_ADMIN
    command: [
      "agent",
      "-server",
      "-bootstrap-expect=3",
      "-node=server2",
      "-datacenter=dc1",
      "-bind=0.0.0.0",
      "-client=0.0.0.0",
      "-retry-join=consul-server1",
      "-ui",
      "-data-dir=/consul/data"
    ]
    ports:
      - "8501:8500"       # HTTP API for host clients
      - "8601:8600/udp"   # Optional DNS mirror
      - "2022:22"
      - "9101:9101"
    networks:
      - consul-net
    restart: unless-stopped
    volumes:
      - consul-server2-data:/consul/data
 
  consul-server3:
    build: .
    container_name: consul-server3
    cap_add:
      - NET_ADMIN
    command: [
      "agent",
      "-server",
      "-bootstrap-expect=3",
      "-node=server3",
      "-datacenter=dc1",
      "-bind=0.0.0.0",
      "-client=0.0.0.0",
      "-retry-join=consul-server1",
      "-ui",
      "-data-dir=/consul/data"
    ]
    ports:
      - "8502:8500"
      - "8602:8600/udp"
      - "2023:22"
      - "9102:9102"
    networks:
      - consul-net
    restart: unless-stopped
    volumes:
      - consul-server3-data:/consul/data
 
networks:
  consul-net:
    driver: bridge

volumes:
  consul-server1-data:
  consul-server2-data:
  consul-server3-data: